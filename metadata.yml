Status: Ready
Title: CheMeleon embeddings
Description: CheMeleon encodes a molecule as 2,048 features with a directed message-passing
  neural network pretrained to reproduce deterministic Mordred descriptors for roughly
  a million PubChem molecules, a noise-free target rather than masked structure or
  experimental labels. Burns and colleagues at MIT reasoned that descriptors already
  carry low-noise chemical information, so predicting them gives a representation
  grounded in known chemistry while remaining learnable. It won most of 58 Polaris
  and MoleculeACE benchmarks but, like the models compared against it, still fails
  to resolve activity cliffs.
