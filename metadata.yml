Title: CheMeleon embeddings
Description: CheMeleon encodes a molecule into 2,048 features by pretraining a graph network to reproduce computed molecular descriptors rather than to reconstruct masked structure. Burns and colleagues at MIT argued that descriptors already condense decades of chemical understanding, so training a network to predict them yields a representation grounded in known chemistry while remaining learnable. The resulting embedding performed strongly across property prediction benchmarks and needs no labelled data to produce.
